<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t.title }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="success">
<h1>✅ {{ heading }}</h1>

<p>{{ t.traderId }}: <strong>{{ trader.trader_code }}</strong></p>
<p>{{ t.businessName }}: <strong>{{ trader.business_name }}</strong></p>
<p>{{ t.ownerName }}: <strong>{{ trader.owner_name }}</strong></p>

<br>

<a href="/traders?lang={{ lang }}"
   style="display:inline-block;background:#146c43;color:white;padding:12px 20px;border-radius:7px;text-decoration:none;margin:5px;">
  {{ t.register }}
</a>

<a href="/?lang={{ lang }}"
   style="display:inline-block;background:#0d6efd;color:white;padding:12px 20px;border-radius:7px;text-decoration:none;margin:5px;">
  {{ t.addAnother }}
</a>

</div>

</body>
</html>
