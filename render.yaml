databases:
  - name: panchayat-traders-db
    plan: free
    databaseName: traders
    user: traders

services:
  - type: web
    name: panchayat-trader-survey
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: panchayat-traders-db
          property: connectionString
